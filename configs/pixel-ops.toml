# Whole-sprite motion (hop / bob / sway) made by moving the 16x16 sprite itself.
# No video model and no GPU: `dotkoma prepare` then `dotkoma finalize` is the whole run.
# Same six Atlas sprites as the pilots (docs/experiments/pilot-02.md), where the video
# models failed every hop / bob.
version = "pixel-ops-v1"

[run]
name = "pixel-ops"
work_dir = "work"

[source]
kind = "atlas"
repo_id = "Angais/pixel-art-atlas-1.4m"
revision = "bf78f8c8cbafa6d07718111a94d41e2dd79ddaa7"
shards = ["data/train-000.parquet"]

# One entry per (subject, action): prepare then picks, for each motion, a sprite of the
# subject with enough transparent margin for it (most Atlas sprites fill the grid).
[[sprites]]
subject = "cat"
actions = ["hop"]
[[sprites]]
subject = "cat"
actions = ["bob"]
[[sprites]]
subject = "cat"
actions = ["sway"]

[[sprites]]
subject = "ghost"
actions = ["hop"]
[[sprites]]
subject = "ghost"
actions = ["bob"]
[[sprites]]
subject = "ghost"
actions = ["sway"]

[[sprites]]
subject = "slime"
actions = ["hop"]
[[sprites]]
subject = "slime"
actions = ["bob"]
[[sprites]]
subject = "slime"
actions = ["sway"]

[[sprites]]
subject = "toy robot"
actions = ["hop"]
[[sprites]]
subject = "toy robot"
actions = ["bob"]
[[sprites]]
subject = "toy robot"
actions = ["sway"]

[[sprites]]
subject = "candle"
actions = ["hop"]
[[sprites]]
subject = "candle"
actions = ["bob"]
[[sprites]]
subject = "candle"
actions = ["sway"]

[[sprites]]
subject = "cup of coffee"
actions = ["hop"]
[[sprites]]
subject = "cup of coffee"
actions = ["bob"]
[[sprites]]
subject = "cup of coffee"
actions = ["sway"]

# A subject with no sprite that has room for a motion is skipped for it, with a warning.
[actions.hop]
generation_method = "pixel_ops"
pixel_ops = { kind = "hop", amplitude = 2, frames = 6, frame_ms = 100 }
[actions.bob]
generation_method = "pixel_ops"
pixel_ops = { kind = "bob", amplitude = 1, frames = 6, frame_ms = 150 }
[actions.sway]
generation_method = "pixel_ops"
pixel_ops = { kind = "sway", amplitude = 1, frames = 6, frame_ms = 150 }
