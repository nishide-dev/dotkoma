# Held-out set for the VLM judge (docs/experiments/judge-02.md): the same 8 actions
# as Pilot 03, new subjects never used in Pilot 03/04 or Tiling 01. Generation as in
# Tiling 01 x1 (resident, 25 frames); prompt = Pilot 03 variant 0.
version = "judge-heldout-01"

[run]
name = "heldout-01"
work_dir = "work"

[source]
kind = "atlas"
repo_id = "Angais/pixel-art-atlas-1.4m"
revision = "bf78f8c8cbafa6d07718111a94d41e2dd79ddaa7"
shards = ["data/train-000.parquet"]

