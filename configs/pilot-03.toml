# Pilot 03: local motions at scale on Wan2.2 I2V-A14B + 4-step Lightning (same model
# settings as pilot-a14b.toml). 8 local actions x 2-3 subjects, 2 prompt wordings each.
# Whole-sprite motion is made by pixel ops instead (configs/pixel-ops.toml).
version = "pilot-03-v1"

[run]
name = "pilot-03"
work_dir = "work"

[source]
kind = "atlas"
repo_id = "Angais/pixel-art-atlas-1.4m"
revision = "bf78f8c8cbafa6d07718111a94d41e2dd79ddaa7"
shards = ["data/train-000.parquet"]

[[sprites]]
subject = "candle"
actions = ["flicker"]
prompt_variants = "all"

[[sprites]]
subject = "torch"
actions = ["flicker"]
prompt_variants = "all"

[[sprites]]
subject = "tea light"
actions = ["flicker"]
prompt_variants = "all"

[[sprites]]
subject = "mug of coffee"
actions = ["steam"]
prompt_variants = "all"

[[sprites]]
subject = "cup of herbal tea"
actions = ["steam"]
prompt_variants = "all"

[[sprites]]
subject = "soup bowl"
actions = ["steam"]
prompt_variants = "all"

[[sprites]]
subject = "chimney"
actions = ["smoke"]
prompt_variants = "all"

[[sprites]]
subject = "fire pit"
actions = ["smoke"]
prompt_variants = "all"

[[sprites]]
subject = "round potion flask"
actions = ["bubble"]
prompt_variants = "all"

[[sprites]]
subject = "cooking cauldron"
actions = ["bubble"]
prompt_variants = "all"

[[sprites]]
subject = "potion decanter"
actions = ["bubble"]
prompt_variants = "all"

[[sprites]]
subject = "star-cut gem"
actions = ["sparkle"]
prompt_variants = "all"

[[sprites]]
subject = "mana crystal"
actions = ["sparkle"]
prompt_variants = "all"

[[sprites]]
subject = "crown"
actions = ["sparkle"]
prompt_variants = "all"

[[sprites]]
subject = "waving flag"
actions = ["flutter"]
prompt_variants = "all"

[[sprites]]
subject = "castle flag"
actions = ["flutter"]
prompt_variants = "all"

[[sprites]]
subject = "flag on pole"
actions = ["flutter"]
prompt_variants = "all"

[[sprites]]
subject = "owl"
actions = ["blink"]
prompt_variants = "all"

[[sprites]]
